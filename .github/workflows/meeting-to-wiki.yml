name: Meeting Issue → Wiki

on:
  issues:
    types:
      - closed

permissions:
  issues: read

jobs:
  create-meeting-note:
    name: Create Meeting Note
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. meeting label 확인
      # --------------------------------------------------
      - name: Check meeting label
        id: check-meeting
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          if [[ ",${LABELS}," == *",meeting,"* ]]; then
            echo "is_meeting=true" >> "$GITHUB_OUTPUT"
            echo "Meeting issue detected."
          else
            echo "is_meeting=false" >> "$GITHUB_OUTPUT"
            echo "This is not a meeting issue."
          fi

      # --------------------------------------------------
      # 2. meeting이 아니면 종료
      # --------------------------------------------------
      - name: Stop if not a meeting issue
        if: steps.check-meeting.outputs.is_meeting != 'true'
        run: |
          echo "Skipping non-meeting issue."

      # --------------------------------------------------
      # 3. Wiki clone
      # --------------------------------------------------
      - name: Checkout Wiki
        if: steps.check-meeting.outputs.is_meeting == 'true'
        env:
          WIKI_PAT: ${{ secrets.WIKI_PAT }}
        run: |
          git clone \
            "https://x-access-token:${WIKI_PAT}@github.com/${REPOSITORY}.wiki.git" \
            wiki

      # --------------------------------------------------
      # 4. Issue Body + Comments → Meeting Note
      # --------------------------------------------------
      - name: Generate Meeting Note
        if: steps.check-meeting.outputs.is_meeting == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: Team-likelion-2nd-Project/likelion-devops-7th-team04
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          CREATED_AT: ${{ github.event.issue.created_at }}
          CLOSED_AT: ${{ github.event.issue.closed_at }}
        run: |
          python3 <<'PY'
          import os
          import re
          import json
          import subprocess

          repository = os.environ["REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          issue_title = os.environ["ISSUE_TITLE"]
          issue_body = os.environ.get("ISSUE_BODY") or ""
          issue_author = os.environ["ISSUE_AUTHOR"]
          created_at = os.environ["CREATED_AT"]
          closed_at = os.environ["CLOSED_AT"]

          # --------------------------------------------------
          # Issue 제목 → 안전한 파일명
          #
          # 공백은 '-'로 변경
          # 파일명에서 사용할 수 없는 문자는 제거
          # Issue Number는 제목 앞에 추가
          # --------------------------------------------------

          def slugify(text):
              text = text.strip()

              # 파일 시스템에서 문제가 될 수 있는 문자 제거
              text = re.sub(r'[\\/:*?"<>|]', '', text)

              # 연속된 공백 → -
              text = re.sub(r'\s+', '-', text)

              return text

          slug = slugify(issue_title)

          filename = f"{issue_number}-{slug}.md"

          # --------------------------------------------------
          # Issue Body 파싱
          # GitHub Issue Form은 다음과 같은 형태로 전달됨:
          #
          # ### 일시
          #
          # 내용
          #
          # ### 참석자
          #
          # 내용
          #
          # ...
          # --------------------------------------------------

          def extract_section(body, heading):
              pattern = rf"###\s+{re.escape(heading)}\s*\n(.*?)(?=\n###\s+|\Z)"
              match = re.search(pattern, body, re.DOTALL)

              if not match:
                  return ""

              return match.group(1).strip()

          date = extract_section(issue_body, "일시")
          attendees = extract_section(issue_body, "참석자")
          agenda = extract_section(issue_body, "안건")
          decisions = extract_section(issue_body, "결정 사항")
          actions = extract_section(issue_body, "액션 아이템")
          next_meeting = extract_section(issue_body, "다음 회의")

          # --------------------------------------------------
          # Comments 조회
          # --------------------------------------------------

          result = subprocess.run(
              [
                  "gh",
                  "api",
                  f"/repos/{repository}/issues/{issue_number}/comments",
                  "--paginate"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          comments = json.loads(result.stdout)

          # --------------------------------------------------
          # Markdown 생성
          # --------------------------------------------------

          lines = []

          lines.append(f"# {issue_title}")
          lines.append("")

          # --------------------------------------------------
          # Meeting Information
          # --------------------------------------------------

          lines.append("## Meeting Information")
          lines.append("")

          lines.append("| 항목 | 내용 |")
          lines.append("|---|---|")
          lines.append(f"| Issue | #{issue_number} |")
          lines.append(f"| 일시 | {date} |")
          lines.append(f"| 참석자 | {attendees} |")

          lines.append("")

          # --------------------------------------------------
          # Agenda
          # --------------------------------------------------

          lines.append("## 안건")
          lines.append("")
          lines.append(agenda)
          lines.append("")

          # --------------------------------------------------
          # Decisions
          # --------------------------------------------------

          lines.append("## 결정 사항")
          lines.append("")
          lines.append(decisions)
          lines.append("")

          # --------------------------------------------------
          # Action Items
          # --------------------------------------------------

          lines.append("## 액션 아이템")
          lines.append("")
          lines.append(actions)
          lines.append("")

          # --------------------------------------------------
          # Next Meeting
          # --------------------------------------------------

          lines.append("## 다음 회의")
          lines.append("")

          if next_meeting:
              lines.append(next_meeting)
          else:
              lines.append("_미정_")

          lines.append("")

          # --------------------------------------------------
          # Comments
          # --------------------------------------------------

          lines.append("## Comments")
          lines.append("")

          if comments:
              for comment in comments:
                  username = comment["user"]["login"]
                  comment_body = comment.get("body") or ""

                  lines.append(f"### @{username}")
                  lines.append("")
                  lines.append(comment_body)
                  lines.append("")
          else:
              lines.append("_No comments._")
              lines.append("")

          # --------------------------------------------------
          # Original Issue
          # --------------------------------------------------

          lines.append("---")
          lines.append("")

          lines.append("## Issue")
          lines.append("")

          lines.append(f"**Issue #{issue_number}**")
          lines.append("")

          lines.append(
              f"[GitHub Issue #{issue_number}]"
              f"(https://github.com/{repository}/issues/{issue_number})"
          )

          lines.append("")

          # --------------------------------------------------
          # Write file
          # --------------------------------------------------

          content = "\n".join(lines)

          directory = "wiki/Meeting-Notes"
          os.makedirs(directory, exist_ok=True)

          filepath = os.path.join(directory, filename)

          with open(filepath, "w", encoding="utf-8") as file:
              file.write(content)

          print(f"Created: {filepath}")
          PY

      # --------------------------------------------------
      # 5. Meeting Notes Index 업데이트
      # --------------------------------------------------
      - name: Update Meeting Notes Index
        if: steps.check-meeting.outputs.is_meeting == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python3 <<'PY'
          import os
          import re

          issue_number = int(os.environ["ISSUE_NUMBER"])
          title = os.environ["ISSUE_TITLE"]

          def slugify(text):
              text = text.strip()

              text = re.sub(r'[\\/:*?"<>|]', '', text)
              text = re.sub(r'\s+', '-', text)

              return text

          slug = slugify(title)

          index_path = "wiki/Meeting-Notes.md"

          if os.path.exists(index_path):
              with open(index_path, "r", encoding="utf-8") as file:
                  content = file.read()
          else:
              content = "# Meeting Notes\n"

          # 기존 링크 추출
          pattern = r"- \[#(\d+) .*?\]\(Meeting-Notes/.*?\)"

          existing = re.findall(pattern, content)

          link = (
              f"- [#{issue_number} {title}]"
              f"(Meeting-Notes/{issue_number}-{slug})"
          )

          # 중복 방지
          if f"#{issue_number} " not in content:
              content += "\n" + link + "\n"

          # --------------------------------------------------
          # Meeting 목록을 Issue Number 기준 내림차순 정렬
          # --------------------------------------------------

          lines = content.splitlines()

          meeting_links = []
          other_lines = []

          for line in lines:
              match = re.match(
                  r"- \[#(\d+) (.*?)\]\(Meeting-Notes/(.*?)\)",
                  line
              )

              if match:
                  meeting_links.append(
                      (int(match.group(1)), line)
                  )
              else:
                  other_lines.append(line)

          meeting_links.sort(
              key=lambda x: x[0],
              reverse=True
          )

          # --------------------------------------------------
          # Index 재구성
          # --------------------------------------------------

          result = []

          result.append("# Meeting Notes")
          result.append("")
          result.append("## Meetings")
          result.append("")

          for _, line in meeting_links:
              result.append(line)

          result.append("")

          with open(index_path, "w", encoding="utf-8") as file:
              file.write("\n".join(result))

          print("Meeting Notes index updated.")
          PY

      # --------------------------------------------------
      # 6. Wiki Commit & Push
      # --------------------------------------------------
      - name: Commit and Push Wiki
        if: steps.check-meeting.outputs.is_meeting == 'true'
        working-directory: wiki
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Meeting-Notes/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "docs: add meeting notes for #${ISSUE_NUMBER}"

          git push